name: Build Android arm64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize git submodules
        run: git submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: apps/readest-app/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare bundled libraries
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Build arm64 release APK
        working-directory: apps/readest-app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init
          pnpm tauri icon ../../data/icons/readest-book.png
          git checkout .

          # This one-off key makes the release artifact directly installable.
          # Use a persistent GitHub secret for upgrades without uninstalling.
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/readest-ci.keystore" \
            -storepass android -keypass android \
            -alias readest-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Readest self-hosted CI"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=readest-ci
          password=android
          storeFile=$RUNNER_TEMP/readest-ci.keystore
          EOF

          pnpm tauri android build --target aarch64

          apk=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -name '*-release.apk' ! -name '*-unsigned.apk' -print -quit)
          test -n "$apk"
          abis=$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          test "$abis" = "arm64-v8a"
          mkdir -p artifacts
          cp "$apk" artifacts/Readest-arm64-v8a-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Readest-arm64-v8a-release
          path: apps/readest-app/artifacts/Readest-arm64-v8a-release.apk
          if-no-files-found: error
